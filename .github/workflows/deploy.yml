name: Deploy

on:
  push:
    branches:
      - main
  # The timetable data is a snapshot of Edupage, so rebuild regularly to pick up changes:
  # every 30 minutes on school days (UTC), once a day at weekends.
  schedule:
    - cron: "*/30 4-17 * * 1-5"
    - cron: "0 6 * * 0,6"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Fetch timetables from Edupage and Tahvel
        # Edupage's school server drops connections from some GitHub runner IPs; the
        # Cloudflare Worker in worker/ relays the requests (deploy it with bun run worker:deploy)
        env:
          FETCH_PROXY: https://tahvel-edupage-proxy.kasparsu.workers.dev
        run: bun run fetch

      - name: Build project
        run: bun run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist